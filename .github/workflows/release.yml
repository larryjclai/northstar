name: Release

# Manual (workflow_dispatch) only — a deliberate choice, not a cost concern. The
# repo is public so GitHub Actions is free, but we don't want every tag push to
# kick off a 4-platform build. The default path is the local macOS release
# script (`scripts/release-local.sh`); use this workflow when you want CI to
# build/publish a tagged release directly on this repo (notably the
# Windows/Linux artifacts the mac-only local script can't produce).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-alpha.7)'
        required: true

# Re-dispatching the same tag cancels the previous in-flight run so we don't
# build the same release twice.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Extract this version's "what's new" from CHANGELOG.md so the GitHub Release
  # body includes the feature notes (falls back to just the install table if the
  # version has no CHANGELOG section).
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          {
            echo "body<<__NOTES_EOF__"
            node scripts/changelog-notes.mjs "$VERSION" || true
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: notes
    permissions:
      contents: write   # required to create GitHub Releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (arm64). No Apple Developer account → no
          # notarization. Users on macOS will see a Gatekeeper prompt the first
          # time they open the app; right-clicking "Open" bypasses it.
          - platform: macos-latest
            args: --target aarch64-apple-darwin

          # macOS — Intel (x86_64)
          - platform: macos-latest
            args: --target x86_64-apple-darwin

          # Linux — produces .deb and .AppImage
          - platform: ubuntu-22.04
            args: ''

          # Windows — produces .msi and .exe (NSIS)
          - platform: windows-latest
            args: ''

    # By default macOS builds run on GitHub-hosted `macos-latest` (free on this
    # public repo). Optionally point the repo variable `MACOS_RUNNER` (Settings →
    # Actions → Variables) at a self-hosted label (e.g. `self-hosted`) if you'd
    # rather build on your own Mac; leaving it unset keeps hosted runners.
    # Linux/Windows always use hosted runners.
    runs-on: ${{ startsWith(matrix.platform, 'macos') && (vars.MACOS_RUNNER || 'macos-latest') || matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # GitHub-hosted runners: install the toolchain via the action.
      - name: Install Rust (stable)
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64 cross-compilation target for Apple Silicon builds
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Self-hosted runners already have a working toolchain (running rustup-init
      # again errors with "cannot install while Rust is installed"). Just make
      # sure the cross-compile targets are present, idempotently.
      - name: Ensure Rust targets (self-hosted)
        if: runner.environment == 'self-hosted' && startsWith(matrix.platform, 'macos')
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            echo "rustup not found — assuming the local toolchain already provides the targets."
          fi

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign private key used to sign update artifacts.
          # Store the contents of your .key file as this secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Leave empty if you created the key without a password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Official builds can opt into Connect sync. Public source builds
          # leave this unset, which disables sync instead of hardcoding a relay.
          VITE_NORTHSTAR_SYNC_WORKER_URL: ${{ vars.NORTHSTAR_SYNC_WORKER_URL }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Northstar ${{ inputs.tag }}
          releaseBody: |
            ${{ needs.notes.outputs.body }}

            ## 安裝方式

            | 平台 | 檔案 |
            |------|------|
            | macOS (Apple Silicon) | `Northstar_*_aarch64.dmg` |
            | macOS (Intel) | `Northstar_*_x64.dmg` |
            | Windows | `Northstar_*_x64-setup.exe` 或 `.msi` |
            | Linux (Debian/Ubuntu) | `northstar_*_amd64.deb` |
            | Linux (通用) | `northstar_*_amd64.AppImage` |

            **macOS 首次開啟提示**：若出現「無法驗證開發者」，請右鍵點擊 app → 選擇「開啟」即可。
          # Draft until EVERY platform has uploaded. tauri-action publishes
          # latest.json incrementally per platform job; with draft=false that
          # meant `releases/latest` could serve a latest.json containing only
          # the first-finished platform for hours (free macOS runners queue
          # long), and every mac user checking updates hit "None of the
          # fallback platforms darwin-aarch64 were found" (v0.1.0-alpha.54,
          # 2026-07-11). While the draft builds, `releases/latest` keeps
          # resolving to the PREVIOUS release, so updaters just say
          # "up to date". The `publish` job below flips the draft live once
          # the whole matrix succeeds.
          releaseDraft: true
          # The repo is public, so release assets download anonymously and the
          # in-app updater can fetch them directly from this repo. tauri-action
          # generates latest.json with same-repo URLs; once the publish job
          # marks the release published (and not prerelease), GitHub points
          # `releases/latest/download/latest.json` at it.
          prerelease: false
          args: ${{ matrix.args }}

  # Flip the draft release live only after ALL platform builds uploaded their
  # artifacts + updater entries — this is what guarantees existing installs
  # never see a partial latest.json.
  publish:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the completed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -1)
          if [ -z "$release_id" ]; then
            echo "No draft release found for $TAG — nothing to publish (already live?)"
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -F draft=false -F make_latest=true >/dev/null
          echo "Published release $TAG (id $release_id)"
