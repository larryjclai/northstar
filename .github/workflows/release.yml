name: Release

# Runs automatically on every `v*` tag push, building and publishing all four
# platforms (macOS arm64 + x86_64, Linux, Windows). This repo is public, so
# Actions minutes are free — the earlier manual-only design was a deliberate
# "don't build 4 platforms on every tag" choice, which the operator revisited
# (2026-07-16): the Windows/Linux artifacts are the point, and dispatching by
# hand every time was the thing actually costing something.
#
# `workflow_dispatch` is kept for re-running a tag whose build failed, or for
# releasing an old tag.
#
# ⚠ `scripts/release-local.sh` is now REDUNDANT for a normal release, and must
# NOT be run for a tag this workflow is already building: it does
# `gh release edit --draft=false`, which would publish the release before the
# Windows/Linux jobs have uploaded — exactly the partial-`latest.json` failure
# (v0.1.0-alpha.54) that the draft-until-all-platforms-finish design below
# exists to prevent. Keep the script for the case CI can't cover (e.g. Actions
# down, or a mac-only hotfix).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-alpha.7)'
        required: true

# The tag being released is `inputs.tag || github.ref_name` throughout: on a tag
# push `inputs` is empty so the fallback picks the pushed ref; on a manual
# dispatch the input wins. The expression is repeated rather than hoisted into
# workflow-level `env` because `concurrency` below can't read the `env` context.

# Re-dispatching (or re-pushing) the same tag cancels the previous in-flight run
# so we don't build the same release twice.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Extract this version's "what's new" from CHANGELOG.md so the GitHub Release
  # body includes the feature notes (falls back to just the install table if the
  # version has no CHANGELOG section).
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the one draft release the whole matrix uploads into
    outputs:
      body: ${{ steps.extract.outputs.body }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      # Read CHANGELOG.md as it was AT THE TAG, not at the default branch —
      # otherwise a manual dispatch of an old tag would splice in notes main has
      # since edited.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: extract
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          {
            echo "body<<__NOTES_EOF__"
            node scripts/changelog-notes.mjs "$VERSION" || true
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Create the single draft release the whole matrix uploads into, and hand
      # its id to every build job.
      #
      # ⚠ Why this job owns release creation (v0.2.0-beta.2, 2026-07-31):
      # previously each of the four matrix jobs passed `tagName` to
      # tauri-action, so each one looked the release up by tag and created it
      # if absent. GitHub does NOT bind a DRAFT release to its tag — a draft is
      # addressable only by id — so that lookup can miss a draft another job
      # just created, and the jobs raced into TWO releases sharing the tag
      # `v0.2.0-beta.2`: one holding macOS x86_64 + Linux, the other holding
      # macOS aarch64 + Windows. Every job reported success. The publish step
      # flipped one of them live, so `releases/latest` served a latest.json
      # with no `darwin-aarch64` key at all and every Apple Silicon updater
      # got "None of the fallback platforms were found" — on the project's
      # primary platform, with a fully green CI run.
      #
      # tauri-action merges latest.json with whatever is already attached to
      # the release, so pinning all four jobs to one id makes the merge
      # converge on one complete file instead of two half-files.
      - id: release
        name: Create (or reuse) the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BODY: ${{ steps.extract.outputs.body }}
        run: |
          set -euo pipefail
          # Re-runs (workflow_dispatch on a tag already built) must reuse the
          # existing release rather than add a second one.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | .[0].id // empty")
          if [ -n "$existing" ]; then
            echo "Reusing existing release $existing for $TAG"
            echo "release_id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            printf '%s\n' "$BODY"
            cat <<'INSTALL_TABLE'

          ## 安裝方式

          | 平台 | 檔案 |
          |------|------|
          | macOS (Apple Silicon) | `Northstar_*_aarch64.dmg` |
          | macOS (Intel) | `Northstar_*_x64.dmg` |
          | Windows | `Northstar_*_x64-setup.exe` 或 `.msi` |
          | Linux (Debian/Ubuntu) | `northstar_*_amd64.deb` |
          | Linux (通用) | `northstar_*_amd64.AppImage` |

          **macOS 首次開啟提示**：若出現「無法驗證開發者」，請右鍵點擊 app → 選擇「開啟」即可。
          INSTALL_TABLE
          } > release-body.md
          release_id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f name="Northstar $TAG" \
            -F draft=true \
            -F prerelease=false \
            -f body="$(cat release-body.md)" \
            --jq .id)
          echo "Created draft release $release_id for $TAG"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: notes
    permissions:
      contents: write   # required to create GitHub Releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (arm64). No Apple Developer account → no
          # notarization. Users on macOS will see a Gatekeeper prompt the first
          # time they open the app; right-clicking "Open" bypasses it.
          - platform: macos-latest
            args: --target aarch64-apple-darwin

          # macOS — Intel (x86_64)
          - platform: macos-latest
            args: --target x86_64-apple-darwin

          # Linux — produces .deb and .AppImage
          - platform: ubuntu-22.04
            args: ''

          # Windows — produces .msi and .exe (NSIS)
          - platform: windows-latest
            args: ''

    # By default macOS builds run on GitHub-hosted `macos-latest` (free on this
    # public repo). Optionally point the repo variable `MACOS_RUNNER` (Settings →
    # Actions → Variables) at a self-hosted label (e.g. `self-hosted`) if you'd
    # rather build on your own Mac; leaving it unset keeps hosted runners.
    # Linux/Windows always use hosted runners.
    runs-on: ${{ startsWith(matrix.platform, 'macos') && (vars.MACOS_RUNNER || 'macos-latest') || matrix.platform }}

    steps:
      # Build the tag's source, not the default branch's. Without this the
      # artifacts would be whatever main happens to hold while carrying the
      # tag's name — silently shipping unreleased code under a released version.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # GitHub-hosted runners: install the toolchain via the action.
      - name: Install Rust (stable)
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64 cross-compilation target for Apple Silicon builds
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Self-hosted runners already have a working toolchain (running rustup-init
      # again errors with "cannot install while Rust is installed"). Just make
      # sure the cross-compile targets are present, idempotently.
      - name: Ensure Rust targets (self-hosted)
        if: runner.environment == 'self-hosted' && startsWith(matrix.platform, 'macos')
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            echo "rustup not found — assuming the local toolchain already provides the targets."
          fi

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Unpack private assets (bank logos + etf feed)
        shell: bash
        env:
          PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}
        run: |
          if [ -z "$PRIVATE_ASSETS_KEY" ]; then
            echo "PRIVATE_ASSETS_KEY not set; skipping private assets (source build)"
            exit 0
          fi
          ./scripts/unpack-private-assets.sh

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign private key used to sign update artifacts.
          # Store the contents of your .key file as this secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Leave empty if you created the key without a password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Official builds can opt into Connect sync. Public source builds
          # leave this unset, which disables sync instead of hardcoding a relay.
          VITE_NORTHSTAR_SYNC_WORKER_URL: ${{ vars.NORTHSTAR_SYNC_WORKER_URL }}
        with:
          # Upload into the ONE release the `notes` job created. Passing
          # `releaseId` (instead of `tagName` + release metadata) is what stops
          # the jobs from each creating their own same-tag draft — see the long
          # note on the `release` step above. tauri-action ignores the
          # tagName/releaseName/releaseBody/releaseDraft/prerelease inputs when
          # releaseId is set: those only ever described a release to CREATE,
          # and creation now happens exactly once, before the matrix starts.
          #
          # The release stays a draft until EVERY platform has uploaded, which
          # is what keeps `releases/latest` resolving to the PREVIOUS release
          # while the build runs, so updaters just say "up to date" instead of
          # fetching a half-written latest.json (v0.1.0-alpha.54, 2026-07-11).
          # The `publish` job flips it live — but only after verifying all four
          # platforms are actually present.
          releaseId: ${{ needs.notes.outputs.release_id }}
          args: ${{ matrix.args }}

  # Flip the draft release live only after ALL platform builds uploaded their
  # artifacts + updater entries — this is what guarantees existing installs
  # never see a partial latest.json.
  publish:
    needs: [notes, publish-tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Publishing is gated on the artifacts that are actually attached, not on
      # the matrix reporting success. In v0.2.0-beta.2 all four build jobs went
      # green while half the artifacts landed on a second, orphaned draft — a
      # release cannot be trusted just because CI is.
      #
      # The previous version of this step looked the draft up by tag with
      # `... | head -1`, which is precisely what let that through: with two
      # same-tag drafts it silently picked one and published it incomplete.
      # It now addresses the release by the id `notes` created, and refuses to
      # publish anything missing a platform.
      - name: Verify all four platforms, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
          NOTES_BODY: ${{ needs.notes.outputs.body }}
        run: |
          set -euo pipefail

          # 1. No second release may share this tag. If one exists, the race
          #    this workflow was fixed for has recurred in some new form —
          #    stop rather than publish half a release.
          others=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .id != ${RELEASE_ID}) | .id] | join(\" \")")
          if [ -n "$others" ]; then
            echo "::error::Another release already carries tag $TAG (ids: $others)."
            echo "::error::Expected exactly one (id $RELEASE_ID). Refusing to publish a split release."
            exit 1
          fi

          # 2. Every installer must be attached.
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name')
          echo "Attached assets:"; echo "$assets" | sed 's/^/  /'
          missing=""
          for pattern in '_aarch64\.dmg$' '_x64\.dmg$' 'x64-setup\.exe$' '_amd64\.deb$' '_amd64\.AppImage$' '^latest\.json$'; do
            echo "$assets" | grep -qE "$pattern" || missing="$missing $pattern"
          done
          if [ -n "$missing" ]; then
            echo "::error::Release $TAG is missing artifacts matching:$missing"
            exit 1
          fi

          # 3. The updater feed must name every platform. This is the check that
          #    would have caught beta.2: the file existed and was valid JSON, it
          #    just had no darwin-aarch64 key, so Apple Silicon updaters failed.
          asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > latest.json
          echo "latest.json platforms:"
          jq -r '.platforms | keys[]' latest.json | sed 's/^/  /'
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "::error::latest.json has no \"$platform\" entry — updaters on that platform would fail."; exit 1; }
          done
          jq -e --arg v "${TAG#v}" '.version == $v' latest.json >/dev/null \
            || { echo "::error::latest.json version does not match $TAG."; exit 1; }

          # 3b. Restore the updater's release notes.
          #
          # tauri-action fills latest.json's `notes` from its `releaseBody`
          # input, and that input is IGNORED when `releaseId` is set (see the
          # note on the publish-tauri step). Since v0.2.0-beta.3 — the first
          # release built after that change — every published latest.json has
          # carried an empty `notes`, so the in-app updater dialog showed no
          # "更新內容" at all. The GitHub Release body was unaffected, which is
          # why it went unnoticed until someone opened the updater.
          #
          # Patch it here rather than in publish-tauri: this is where the file
          # is already downloaded and verified, and it is still a draft, so no
          # updater can observe the intermediate state.
          #
          # The install table deliberately does NOT go in: the reader of this
          # text is already installed and updating in place. It stays in the
          # GitHub Release body, which is where people who need to download go.
          printf '%s' "$NOTES_BODY" > updater-notes.md
          if [ -s updater-notes.md ]; then
            jq --rawfile notes updater-notes.md '.notes = $notes' latest.json > latest.patched.json
            mv latest.patched.json latest.json
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            gh api --method POST \
              -H "Content-Type: application/json" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json" \
              --input latest.json >/dev/null
            echo "Patched latest.json notes ($(wc -c < updater-notes.md) bytes)."

            # 3c. Re-fetch what was just uploaded and re-verify it: the asset
            # id changed (delete + upload, not an in-place edit), and a
            # mangled re-upload here would break every updater on every
            # platform, which is a far worse failure than the empty notes
            # this step exists to fix. Still a draft, so still safe to catch.
            new_asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
              --jq '.[] | select(.name == "latest.json") | .id')
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${new_asset_id}" > latest.reuploaded.json
            jq -e '.notes | length > 0' latest.reuploaded.json >/dev/null \
              || { echo "::error::Re-uploaded latest.json has empty notes — upload was corrupted."; exit 1; }
            for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
              jq -e --arg p "$platform" '.platforms | has($p)' latest.reuploaded.json >/dev/null \
                || { echo "::error::Re-uploaded latest.json lost the \"$platform\" entry — upload was corrupted."; exit 1; }
            done
            echo "Verified re-uploaded latest.json: notes present, all four platforms intact."
          else
            echo "::warning::No CHANGELOG section for ${TAG#v} — latest.json notes left empty."
          fi

          # 4. Only now make it the release users resolve to.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F make_latest=true >/dev/null
          echo "Published release $TAG (id $RELEASE_ID) with all four platforms verified."
