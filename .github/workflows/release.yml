name: Release

# Triggered by version tags: git tag v0.1.0-alpha.7 && git push --tags
# Can also be triggered manually from the Actions tab (for re-runs / debugging).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-alpha.7)'
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write   # required to create GitHub Releases

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (arm64). No Apple Developer account → no
          # notarization. Users on macOS will see a Gatekeeper prompt the first
          # time they open the app; right-clicking "Open" bypasses it.
          - platform: macos-latest
            args: --target aarch64-apple-darwin

          # macOS — Intel (x86_64)
          - platform: macos-13
            args: --target x86_64-apple-darwin

          # Linux — produces .deb and .AppImage
          - platform: ubuntu-22.04
            args: ''

          # Windows — produces .msi and .exe (NSIS)
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64 cross-compilation target for Apple Silicon builds
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign private key used to sign update artifacts.
          # Store the contents of your .key file as this secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Leave empty if you created the key without a password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Northstar ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            ## 安裝方式

            | 平台 | 檔案 |
            |------|------|
            | macOS (Apple Silicon) | `Northstar_*_aarch64.dmg` |
            | macOS (Intel) | `Northstar_*_x64.dmg` |
            | Windows | `Northstar_*_x64-setup.exe` 或 `.msi` |
            | Linux (Debian/Ubuntu) | `northstar_*_amd64.deb` |
            | Linux (通用) | `northstar_*_amd64.AppImage` |

            **macOS 首次開啟提示**：若出現「無法驗證開發者」，請右鍵點擊 app → 選擇「開啟」即可。
          # Create as draft so you can review before publishing.
          # Change to false to publish immediately on tag push.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(inputs.tag, 'alpha') || contains(inputs.tag, 'beta') || contains(inputs.tag, 'rc') }}
          args: ${{ matrix.args }}
