name: CLA Assistant

# Requires the contributor to sign the Contributor License Agreement (CLA.md)
# before their pull request can be merged. Uses the cla-assistant pattern
# (contributor-assistant/github-action). Signatures are stored as a JSON file
# in a separate signatures repo/branch (see docs/open-source-readiness.md for
# the operator setup: PERSONAL_ACCESS_TOKEN secret + signatures storage repo).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read       # 'write' only if signatures are stored in THIS repo
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # GITHUB_TOKEN is provided automatically by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN is an OPERATOR-PROVIDED secret with write access
          # to the signatures storage repo. NOT wired here — see readiness doc.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          # Phrase contributors must comment to sign.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          # Comment the bot posts asking for a signature.
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can merge this pull request, please read our [Contributor License Agreement (CLA.md)](CLA.md) and sign it by posting the following comment:'
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/<OWNER>/<REPO>/blob/main/CLA.md'
          # OPERATOR: set this to your signatures storage repo (can be this repo
          # on a dedicated branch, or a separate private repo).
          remote-organization-name: '<SIGNATURES_ORG_OR_OWNER>'
          remote-repository-name: '<SIGNATURES_REPO>'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          # Block the PR merge status until signed.
          lock-pullrequest-aftermerge: false
