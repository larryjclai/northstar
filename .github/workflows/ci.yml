name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Existing gate: lint + tsc + vitest. Unchanged in content.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc
      - run: npm test

  # Catches bundler-only failures the tsc gate misses (`build` = tsc && vite build).
  # `prebuild` (inject-private-assets.mjs) no-ops gracefully when private-assets/ is
  # absent, so no secrets are required here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build

  # Compiles the Rust shell (cargo fmt --check && cargo check). Rust setup and the
  # Linux system deps mirror release.yml's publish-tauri job for consistency.
  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Retried for the same reason as the e2e job's install step: a slow or
      # flapping azure.archive.ubuntu.com mirror is transient, and one bad
      # fetch should not fail the whole gate.
      - name: Install Linux system dependencies
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf; then
              exit 0
            fi
            echo "::warning::apt-get failed (attempt $attempt/3); retrying in 15s"
            sleep 15
          done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check:tauri

  # Builds the iOS app. This gate was missing when the Apple Foundation Models
  # Swift bridge landed: lib.rs declared five `@_cdecl` symbols whose Swift file
  # was never wired into the Xcode target, so `tauri ios build` failed to link
  # from 2026-06-28 until PR #34 — over a month — while every job above stayed
  # green, because they all run on Linux and never touch Xcode.
  #
  # Simulator target on purpose: it links the same libapp.a through the same
  # xcodebuild phase (so it catches that whole class of breakage) without needing
  # a signing certificate or an Apple account on the runner.
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # `prebuild` (inject-private-assets.mjs) no-ops without private-assets/,
      # so this needs no secrets — same as the `build` job above.
      - name: Build iOS app (simulator, unsigned)
        run: npm run tauri ios build -- --target aarch64-sim --debug

  # Typechecks the sync worker (its own package.json / tsconfig, compiles standalone).
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Playwright smoke test: drives the wired-up first-run flow (trust surfaces →
  # cash-flow filters → ⌘N quick-add → recompute) that the unit suite can't cover.
  # playwright.config.ts runs the single smoke spec under two projects — chromium
  # and a mobile (WebKit) device — so both browsers are installed. The dev server
  # is launched by the config's `webServer` (npm run dev).
  #
  # Budget note (measured 2026-08-04 over 6 healthy runs): the test step is very
  # stable at 517–540s, while browser setup ranged 42–89s. On 2026-08-04 a slow
  # apt mirror stretched the combined `install --with-deps` step to 14m51s, which
  # ate the entire 15-minute job budget and cancelled the run before a single
  # test executed. The setup work below is therefore split, capped, and retried
  # so a slow mirror can no longer starve the tests.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are content-addressed by Playwright version, so the
      # version alone is a sound key. The browser list is in the key too, so
      # adding a project/browser later can't silently restore a stale cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit

      # apt system libs land in /usr and are NOT covered by the cache above, so
      # this runs every time — and it is the step that actually flaked. Its own
      # timeout means a stalled mirror fails here, fast and legibly, instead of
      # silently consuming the test step's budget.
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::playwright install-deps failed (attempt $attempt/3); retrying in 15s"
            sleep 15
          done
          exit 1

      # Run unconditionally rather than gating on a cache hit: it is a fast
      # no-op when the cache restored intact, and it still self-heals a partial
      # or stale restore instead of failing later inside the test run.
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::playwright install failed (attempt $attempt/3); retrying in 15s"
            sleep 15
          done
          exit 1

      - run: npm run test:e2e
