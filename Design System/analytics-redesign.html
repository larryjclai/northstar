<!doctype html>
<html lang="zh-Hant" data-theme="dark" data-density="loose" data-fonts="space" data-radius="default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NorthStar — Analytics 改版方向</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="northstar-tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #111312; }
    body { font-family: "Space Grotesk", ui-sans-serif, system-ui, "Noto Sans TC", sans-serif; -webkit-font-smoothing: antialiased; }
    #root { width: 100vw; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="northstar-shared.jsx"></script>
  <script type="text/babel" src="northstar-analytics-viz.jsx"></script>
  <script type="text/babel" src="northstar-analytics-blocks.jsx"></script>
  <script type="text/babel" src="northstar-analytics-variants.jsx"></script>

  <script type="text/babel">
    const { useEffect } = React;
    // Seed a fit-to-view zoom on first open so all three directions are visible.
    try {
      const vk = 'dc-viewport:' + location.pathname;
      if (!localStorage.getItem(vk)) {
        localStorage.setItem(vk, JSON.stringify({ x: 40, y: 36, scale: 0.34 }));
      }
    } catch (e) {}
    function App() {
      // keep the dark theme stable
      useEffect(() => { document.documentElement.setAttribute('data-theme', 'dark'); }, []);
      const boards = [
        { id: 'A', label: 'A · 編輯感 — 深色 feature band 為主', Cmp: NSAnVariantA },
        { id: 'B', label: 'B · 專業終端 — 密集網格',            Cmp: NSAnVariantB },
        { id: 'C', label: 'C · 引導式 — 散戶白話洞察',          Cmp: NSAnVariantC },
      ];
      return (
        <DesignCanvas minScale={0.12} maxScale={1.4}>
          <DCSection id="analytics" title="Holdings · Analytics 改版方向" subtitle="同一頁的三種設計取向 — 點右上角放大鈕可全螢幕比較">
            {boards.map(b => (
              <DCArtboard key={b.id} id={b.id} label={b.label} width={1180}
                style={{ height: 'auto', background: 'var(--ns-bg)' }}>
                <b.Cmp />
              </DCArtboard>
            ))}
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
