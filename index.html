<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: WKWebView auto-zooms when a focused input
         has font-size < 16px, which feels非原生 in the iOS app. Locking the
         viewport scale disables that focus zoom (and pinch zoom — acceptable
         for an app shell, all content has its own scaling). viewport-fit=cover
         lets the app paint behind the notch/home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Northstar</title>
    <!-- Fonts (IBM Plex family + Space Grotesk wordmark) are bundled via
         src/styles/fonts.css — no CDN, so offline first paint is identical. -->
  </head>
  <body>
    <!-- Prewarm CJK + emoji fallback fonts so the first real render doesn't
         stutter mapping in PingFang/Noto/Apple Color Emoji on a cold start
         (native-feel-skill § A.9 fallback-font cold start). aria-hidden + fully
         offscreen so it never affects layout or assistive tech. -->
    <div aria-hidden="true" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;white-space:nowrap;pointer-events:none">總覽投資記帳帳戶目標設定資產現金流動股利匯率 0123456789 ↑↓✓✕＄€¥ 📈📉💰⭐️🔒</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
